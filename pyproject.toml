[project]
name = "learning-dynamics"
version = "0.1.0"
description = "Learning dynamics of encoder-decoder models during continued pretraining (CPT)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.6.0",
    "transformers>=5.12.1",
    "datasets>=3.0.0,<4.0.0",
    "accelerate>=1.13.0",
    "evaluate>=0.4.0",
    "sentencepiece>=0.2.0",
    "sacrebleu>=2.4.0",
    "wandb>=0.27.2",
    "pyyaml>=6.0",
    "numpy>=2.0.0",
    "requests>=2.30.0",
    "scikit-learn>=1.5.0",
    "python-dotenv>=1.0.0"
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.9.0",
    "pytest>=9.1.1",
]
