# Bilingual-arm MT. Derived from configs/finetune/mt_5epoch.yaml - the
# STANDARD MT protocol (5 epochs, 50,000 WMT22 pairs, en->xh forward only).
# The 3-epoch configs/finetune/mt.yaml is superseded. Only results_dir and
# wandb_project differ from the monolingual arm.
# MT en->xh, 5 epochs (supervisor: 3-epoch runs never overfit - best epoch
# was always the last and val loss still falling). Otherwise identical to
# mt.yaml. Separate results dir + W&B project: different protocol.
task: "mt"
data_dir: "data/finetune/mt"

learning_rate: 1.0e-5
batch_size: 4
gradient_accumulation_steps: 4
num_epochs: 5
lr_scheduler_type: "linear"
warmup_steps: 0

eval_batch_size: 8
max_source_length: 512
max_target_length: 512
num_beams: 5
max_new_tokens: 512

source_prefix: ""
direction: "en-xh"
direction_prefix: "Translate English to Xhosa: "
n_train_pairs: 50000

wandb_project: "cpt-bilingual-mt"
work_dir: "/scratch/rmdrak003/finetune_work"
results_dir: "results_bilingual_mt"
