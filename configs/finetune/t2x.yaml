# T2X (isiXhosa data-to-text) finetuning protocol.
#
# Hyperparameters from Meyer & Buys (2024) / NGLUEni (Meyer et al. 2024),
# section "5.2 NLG": Adafactor, lr 1e-4, no warmup, batch size 4.
#
# The paper finetunes "until validation loss increases, which is before 5
# epochs for all models". We instead run a FIXED 5 epochs and select the
# best epoch by validation loss. This is deliberate: adaptive stopping
# would give different checkpoints different training budgets, which
# would confound CPT progress with finetuning duration on the learning
# dynamics curve. Fixed budget + best-epoch selection measures every
# checkpoint identically while still reporting the same quantity the
# paper reports.
task: "t2x"
# Written by src.data_processing.download_finetune_data --tasks d2t.
# Test references are ragged: 1-8 per input (63 have 1, 159 have 3,
# one has 8), which is why metrics.py None-pads the transposition.
data_dir: "data/finetune/d2t"

learning_rate: 1.0e-4
batch_size: 4
num_epochs: 5
lr_scheduler_type: "constant"   # no warmup, no decay
warmup_steps: 0

eval_batch_size: 8

# T2X inputs are linearised triples (~110 chars per triple, up to 3).
# 512 never truncates either a subword or a byte-level model here.
max_source_length: 512
max_target_length: 256

# FROZEN generation settings - identical for every checkpoint.
num_beams: 5
max_new_tokens: 256

source_prefix: ""   # supervisor may specify; identical for all checkpoints

work_dir: "/scratch/rmdrak003/finetune_work"
results_dir: "results/finetune"
