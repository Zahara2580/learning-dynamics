# D2T with 20% warmup - separate protocol from configs/finetune/d2t.yaml,
# which has none. 20% of 4,825 steps = 965 = exactly one epoch to peak LR,
# then linear decay. Everything else matches the paper.
task: "d2t"
data_dir: "data/finetune/d2t"

learning_rate: 1.0e-4
batch_size: 4
num_epochs: 5
lr_scheduler_type: "linear"
warmup_ratio: 0.20

eval_batch_size: 8
max_source_length: 512
max_target_length: 512
num_beams: 5
max_new_tokens: 512
source_prefix: ""

wandb_project: "cpt-d2t-warmup20"
work_dir: "/scratch/rmdrak003/finetune_work"
results_dir: "results_d2t_warmup_20"
