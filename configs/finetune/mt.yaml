# MT (en -> xh) finetuning protocol.
# NGLUEni / Adelani et al. (2022a): Adafactor, lr 1e-5, linear decay,
# no warmup, batch 16, 3 epochs, direction-prefixed source.
# Train: WMT22 top-N by laser_score (load_mt_train). Eval: FLORES dev/
# devtest live in data_dir (val/test).
task: "mt"
data_dir: "data/finetune/mt"

learning_rate: 1.0e-5
batch_size: 16
num_epochs: 3
lr_scheduler_type: "linear"     # linear decay, no warmup
warmup_steps: 0

eval_batch_size: 8

max_source_length: 512
max_target_length: 384

# FROZEN generation settings - identical for every checkpoint.
num_beams: 5
max_new_tokens: 384

source_prefix: ""
direction_prefix: "Translate English to Xhosa: "

# WMT22 pairs used for training: dedupe exact pairs, take top-N by
# laser_score. Raisable later if MT needs more data (per supervisor).
n_train_pairs: 10000

work_dir: "/scratch/rmdrak003/finetune_work"
results_dir: "results/finetune"
